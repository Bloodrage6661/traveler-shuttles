name: Keep Supabase awake

# Supabase free-tier projects pause after 7 days of no database activity.
# This pings an endpoint that runs a Supabase query once a day, resetting the timer.

on:
  schedule:
    - cron: "0 5 * * *" # every day at 05:00 UTC (07:00 SAST)
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping availability endpoint (touches the database)
        run: |
          MONTH=$(date -u +%Y-%m)
          URL="https://www.travelershuttlesandtours.co.za/api/availability?month=${MONTH}"
          echo "Pinging ${URL}"
          curl -fsS --retry 3 --retry-delay 10 "${URL}" -o /dev/null
          echo "Done — Supabase activity timer reset."
